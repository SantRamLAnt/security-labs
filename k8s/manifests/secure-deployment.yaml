# LAB D — the same application, conforming to the restricted baseline.
# Every change here maps to a rule in policies/kyverno-baseline.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outage-portal
  namespace: workloads
  labels:
    app: outage-portal
    lab: lab-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outage-portal
  template:
    metadata:
      labels:
        app: outage-portal
    spec:
      # no host namespaces
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # explicit version tag (the image-provenance policy refuses :latest and untagged).
          # nginx-unprivileged listens on 8080 and runs without root, so the pod can
          # actually start under runAsNonRoot + readOnlyRootFilesystem on a real cluster.
          image: nginxinc/nginx-unprivileged:1.27.3-alpine
          ports:
            - containerPort: 8080
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            # read-only root filesystem means writable paths must be explicit
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
