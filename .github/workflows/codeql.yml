# A sixth scanner: GitHub CodeQL on the whole repository. Advisory, not one of the required gates.
# Semgrep (Gate 3) matches patterns; CodeQL follows data from where it enters (a request
# parameter, say) to where it's used (a shell command), across functions. Findings go to the
# repository's code scanning alerts. The benchmark cases are excluded: they are vulnerable on
# purpose and are scanned separately by the AI reviewer benchmark.
name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: "CodeQL (${{ matrix.language }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [ python, actions ]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - ci/ai-review/cases
              - ci/ai-review/work
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
