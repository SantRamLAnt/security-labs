# LAB E — DevSecOps security gates
# Five BLOCKING gates. Advisory scanning gets ignored; a failed build does not.
# Control mapping: NERC CIP-010-4 R1, CIP-013-2 R1, NIST SA-11, SA-15, CM-3, RA-5
#
# Gate 0 tests the POLICIES and the SCANNERS. A gate that has silently stopped
# evaluating fails open: "zero violations" and "zero rules evaluated" look identical.
# Run #1 of this pipeline proved it — two gates passed green with the planted
# problems still in the repository (see labs/lab-e-README.md, "Findings").

name: Security Gates

on:
  push:
    branches: [ main, "lab/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFTEST_VERSION: "0.56.0"
  KYVERNO_VERSION: "1.13.4"
  GITLEAKS_VERSION: "8.21.2"
  TRIVY_VERSION: "v0.76.1"   # pinned: older trivy release assets were withdrawn upstream

jobs:

  policy-self-test:
    name: "Gate 0 · Policy and scanner self-test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conftest, kyverno, gitleaks
        run: |
          set -euo pipefail
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz | tar xz conftest
          curl -sSL https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz | tar xz kyverno
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar xz gitleaks
          sudo mv conftest kyverno gitleaks /usr/local/bin/

      - name: OPA policy unit tests (plan JSON and Terraform source)
        env:
          POLICY_DIR: policy
        run: ./policy-tests/run-policy-tests.sh

      - name: Admission policy must still refuse a known-bad workload
        run: |
          set -uo pipefail
          # kyverno exits 1 whenever any rule fails. GitHub runs steps with bash -e -o pipefail,
          # so without "|| true" the step dies inside $( ) before printing anything (run #1).
          fails() {
            { kyverno apply k8s/policies/kyverno-baseline.yaml --resource "$1" 2>&1 || true; } \
              | sed -n 's/.*fail: \([0-9]\+\).*/\1/p' | tail -1
          }
          bad=$(fails k8s/manifests/insecure-deployment.yaml)
          good=$(fails k8s/manifests/secure-deployment.yaml)
          echo "insecure manifest denials: ${bad:-none}"
          echo "secure   manifest denials: ${good:-none}"
          if [ -z "${bad:-}" ] || [ "${bad}" -eq 0 ]; then
            echo "::error::Known-bad workload was ACCEPTED. Admission policy has regressed."; exit 1
          fi
          if [ "${good:-1}" -ne 0 ]; then
            echo "::error::Conforming workload was REFUSED. Policy is over-broad."; exit 1
          fi

      - name: Secret scanner must still catch a freshly generated secret
        run: |
          set -uo pipefail
          # A random token generated at run time: never committed, never a real credential.
          d=$(mktemp -d)
          # (not "tr </dev/urandom | head": under pipefail that dies of SIGPIPE, exit 141)
          tok=$(python3 -c "import secrets,string; a=string.ascii_letters+string.digits; print(''.join(secrets.choice(a) for _ in range(40)))")
          printf 'GRIDOPS_API_KEY = "%s"\n' "$tok" > "$d/canary.py"
          if gitleaks detect --no-git --source "$d" --redact --no-banner -v; then
            echo "::error::gitleaks did NOT detect the canary secret. Gate 1 cannot be trusted."; exit 1
          fi
          echo "canary detected: Gate 1 is evaluating"
          # Documented limitation, printed every run so it is never forgotten:
          printf 'AWS_ACCESS_KEY_ID = "AKIAIOSFODNN7EXAMPLE"\n' > "$d/canary.py"
          if gitleaks detect --no-git --source "$d" --no-banner >/dev/null 2>&1; then
            echo "note: AWS's documentation example key is allowlisted by gitleaks defaults (not detected)."
          fi

  secret-scan:
    name: "Gate 1 · Secret scanning (full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the whole history, not just the latest commit
      - name: gitleaks (CLI, every commit)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner -v

  iac-scan:
    name: "Gate 2 · Infrastructure as code"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov
        run: |
          pip install --quiet checkov
          checkov --directory infra/ --framework terraform --compact --quiet
      - name: Conftest (our own OPA policy, against Terraform source)
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest test infra/ -p policy/ --all-namespaces --no-color

  sast:
    name: "Gate 3 · Static analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (findings fail the job)
        run: |
          pip install --quiet semgrep
          # --error makes findings exit non-zero. Without it semgrep reports and exits 0.
          semgrep scan --config p/python --config p/secrets --error --metrics=off app/

  dependency-scan:
    name: "Gate 4 · Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy (HIGH and CRITICAL fail the gate)
        run: |
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz | tar xz trivy
          ./trivy fs app/ --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress
