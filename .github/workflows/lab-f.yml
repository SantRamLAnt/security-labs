# LAB F: offline checks. No model is called and no credentials are used.
name: Lab F · Checker regression cases and statistics
on:
  push:
    branches: [ main ]
    paths: [ "labs/lab-f/**", ".github/workflows/lab-f.yml" ]
  pull_request:
    paths: [ "labs/lab-f/**", ".github/workflows/lab-f.yml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: "Lab F regression cases + intervals"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regression cases for the unsafe-advice checker (21, exact)
        run: |
          set -o pipefail
          python3 labs/lab-f/test_misinformation.py | tee t.out
          { echo '### Lab F regression cases'; echo '```'; cat t.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Confidence intervals (pinned values)
        run: |
          set -o pipefail
          python3 labs/lab-f/stats.py --check | tee s.out
          { echo '### Lab F intervals'; echo '```'; cat s.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
