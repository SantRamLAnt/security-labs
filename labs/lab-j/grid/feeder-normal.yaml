# SYNTHETIC distribution model. Invented names and values; not any real utility's system.
# The normal (as-designed) configuration of two radial 13.8 kV feeders out of one substation.
change:
  switching_order: SO-2026-1031-001
  approved_by: system-operations-engineering
  reason: "Baseline: record the normal configuration of F101 and F102"
substation: SUB-NORTH
feeders:
  - id: F101
    voltage_kv: 13.8
    devices:
      - {id: CB-101,  type: breaker,  phases: [A, B, C], rating_a: 600, upstream: null,   normal: closed}
      - {id: R-1011,  type: recloser, phases: [A, B, C], rating_a: 400, upstream: CB-101, normal: closed}
      - {id: FU-1012, type: fuse,     phases: [A],       rating_a: 65,  upstream: R-1011, normal: closed}
      - {id: FU-1013, type: fuse,     phases: [B],       rating_a: 40,  upstream: R-1011, normal: closed}
      - {id: SW-12,   type: switch,   phases: [A, B, C], upstream: R-1011, ties_to: F102, normal: open}
  - id: F102
    voltage_kv: 13.8
    devices:
      - {id: CB-102,  type: breaker,  phases: [A, B, C], rating_a: 600, upstream: null,   normal: closed}
      - {id: R-1021,  type: recloser, phases: [A, B, C], rating_a: 300, upstream: CB-102, normal: closed}
      - {id: FU-1022, type: fuse,     phases: [C],       rating_a: 50,  upstream: R-1021, normal: closed}
